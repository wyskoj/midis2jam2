# General MIDI 2 sound set: 256 melodic voices, all in bank MSB 79H (121).
#
# Transcribed from General MIDI 2 v1.2a (MMA RP-024), Appendix A. `program` is 1-based, as the specification
# prints it; `lsb` is the bank select LSB (controller 32), 0 when omitted.
# A voice with no `look` appears as the General MIDI voice with the same program (gm.yaml), which is also what
# the specification (section 2.6) says a device should play for a variation it doesn't have.


