# Roland GS melodic voices (tones).
#
# Transcribed from the SC-8850 Owner's Manual, Instrument List, using the SC-8850 map's names. `program` is
# 1-based, as the manual prints it; `msb` is the variation number (controller 0). The LSB (controller 32) only
# picks between the SC-55, SC-88, SC-88Pro and SC-8850 sound maps, so it isn't part of the key.
# A voice with no `look` appears as the General MIDI voice with the same program (its capital tone).
#
# Transcribed in full: the Instrument List (pages 167-185) and the CM-64 map (page 186). Names ending in
# "(legato)" are the manual's legato-enabled sounds, which it marks with a trailing colon.
# A voice marked `look: None` is a different sound from its program's instrument (a door is not a telephone), so
# it puts nothing on stage rather than the wrong thing.


