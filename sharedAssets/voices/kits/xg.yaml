# Yamaha XG drum kits.
#
# Transcribed from XG Specifications v1.32, Table 2 (XG Drum Map). `program` is 1-based, as the specification
# prints it. Drum kits are in bank 127, SFX kits in bank 126. A rhythm channel on bank 0 is looked up as bank 127.
# XG's electronic kits keep the reverse cymbal on note 28 rather than 52, so they're drawn as the analog kit.
# The Symphony Kit keeps its drums at the General MIDI positions (no timpani), so it's drawn as a standard kit.

# Drum kits, bank 127 (XG Specifications v1.32, Drum Map, pages 63-71)
- program: 1
  msb: 127
  name: "Standard Kit"
  look: Standard
- program: 2
  msb: 127
  name: "Standard Kit 2"
  look: Standard
