# Roland GS drum sets.
#
# Transcribed from the SC-8850 Owner's Manual, Drum Set List, using the SC-8850 map's names. `program` is 1-based,
# as the manual prints it. Drum machine kits (Hip Hop, House, TR-808 and the like) are drawn as the analog kit.
# Kits marked `look: None` lay their notes out differently from the General MIDI kits, so they draw nothing
# rather than hitting the wrong drums.

