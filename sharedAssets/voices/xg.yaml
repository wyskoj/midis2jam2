# Yamaha XG melodic voices.
#
# Transcribed from the "YAMAHA XG Voice List" (the 480-voice set), whose P.C Number column reads
# MSB-LSB-program. `program` is 1-based, as printed. XG's own rule (XG Specifications v1.32, p.102) is that an
# unmapped variation sounds as bank MSB 0, so a voice with no `look` appears as its General MIDI voice.
#
# Transcribed in full: all 480 voices of the list, including the SFX voices in bank 64.


