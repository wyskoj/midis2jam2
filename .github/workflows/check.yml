name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Not `check`: Android lint currently reports a pre-existing error, so the tests are
      # run directly until that is fixed. The suite needs no display, no audio device and no
      # MIDI hardware - the performance tests boot jMonkeyEngine on its headless context.
      - name: Run tests
        run: ./gradlew :app:desktopTest :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
