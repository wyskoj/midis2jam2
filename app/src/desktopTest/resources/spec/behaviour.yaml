# Behaviour catalogue for midis2jam2.
#
# Every entry is one behavioural claim the product makes. Most are transcribed from the
# documentation site (https://docs.midis2jam2.xyz/, source in the sibling midis2jam2-docs
# repository); entries with "source: code" are behaviours the app implements that the docs
# do not yet describe.
#
# Tests cite an id with @Spec("..."). SpecCoverageTest fails if a catalogued id has no
# citing test and is neither waived nor pending. Re-sync this file when the docs change.
#
# Fields:
#   id        - stable dotted identifier, cited by tests
#   source    - docs page it came from, or "code"
#   platforms - desktop, android, or both
#   claim     - the behaviour, in the docs' own words where possible
#   waived    - if present, why no automated test will ever cover it (reported, never silent)
#   pending   - if present, why it is not covered *yet*. This is the backlog, and it must
#               shrink to nothing. Delete the marker when you add the test - the suite
#               fails if a pending behaviour turns out to have one.

# ---------------------------------------------------------------- getting started (index.md)
- id: home.midi-file.picker
  source: index.md
  platforms: [desktop]
  claim: "Clicking the MIDI file text field opens a file picker"
  waived: "Opens a native file dialog; not drivable headlessly."
- id: home.play.opens-performance
  source: index.md
  platforms: [desktop, android]
  claim: "Clicking Play opens the performance screen and starts the MIDI file"
  waived: "Requires a real window and MIDI device; covered indirectly by the headless harness."

