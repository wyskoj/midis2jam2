# Behaviour catalogue for midis2jam2.
#
# Every entry is one behavioural claim the product makes. Most are transcribed from the
# documentation site (https://docs.midis2jam2.xyz/, source in the sibling midis2jam2-docs
# repository); entries with "source: code" are behaviours the app implements that the docs
# do not yet describe.
#
# Tests cite an id with @Spec("..."). SpecCoverageTest fails if a catalogued id has no
# citing test and is neither waived nor pending. Re-sync this file when the docs change.
#
# Fields:
#   id        - stable dotted identifier, cited by tests
#   source    - docs page it came from, or "code"
#   platforms - desktop, android, or both
#   claim     - the behaviour, in the docs' own words where possible
#   waived    - if present, why no automated test will ever cover it (reported, never silent)
#   pending   - if present, why it is not covered *yet*. This is the backlog, and it must
#               shrink to nothing. Delete the marker when you add the test - the suite
#               fails if a pending behaviour turns out to have one.

# ---------------------------------------------------------------- getting started (index.md)
- id: home.midi-file.picker
  source: index.md
  platforms: [desktop]
  claim: "Clicking the MIDI file text field opens a file picker"
  waived: "Opens a native file dialog; not drivable headlessly."
- id: home.play.opens-performance
  source: index.md
  platforms: [desktop, android]
  claim: "Clicking Play opens the performance screen and starts the MIDI file"
  waived: "Requires a real window and MIDI device; covered indirectly by the headless harness."

# ------------------------------------------------------------------------------- faq (faq.md)
- id: midi.assignment.by-program-change
  source: faq.md
  platforms: [desktop, android]
  claim: "Instruments are assigned to tracks based on the program change messages in the MIDI file"
- id: midi.assignment.default-piano
  source: faq.md
  platforms: [desktop, android]
  claim: "If the MIDI file contains no program change messages, a piano is assigned to the track"
- id: midi.assignment.mode.reset-message
  source: code
  platforms: [desktop, android]
  claim: "A GM, GM2, GS or XG reset message in the file decides how its bank select messages are read from then on"
- id: midi.assignment.mode.settings
  source: code
  platforms: [desktop, android]
  claim: "A file without a reset message of its own is read in the specification the app is set to send a reset for, or as General MIDI if none"
- id: midi.assignment.bank-select.gm2
  source: code
  platforms: [desktop, android]
  claim: "In GM2 mode, a voice chosen with bank select appears as its own instrument when the app has one for it"
- id: midi.assignment.bank-select.gs
  source: code
  platforms: [desktop, android]
  claim: "In GS mode, bank select picks a variation of the program, which appears as the same instrument as the program"
- id: midi.assignment.bank-select.xg
  source: code
  platforms: [desktop, android]
  claim: "In XG mode, voices are chosen by both bank select MSB and LSB"
- id: midi.assignment.bank-select.gs-cm64
  source: code
  platforms: [desktop, android]
  claim: "In GS mode, banks 126 and 127 select the CM-64 (MT-32) sounds, each drawn as its General MIDI counterpart rather than by its program number"
- id: midi.assignment.bank-select.gs-kits
  source: code
  platforms: [desktop, android]
  claim: "In GS mode, drum kits laid out unlike the General MIDI kits (such as Ethnic or Rhythm FX) draw nothing, while drum machine kits draw a drum set"
- id: midi.assignment.bank-select.xg-sfx
  source: code
  platforms: [desktop, android]
  claim: "In XG mode, sound effects in bank 64 are drawn as their own instrument or nothing, never as the General MIDI instrument with the same program number"
- id: midi.assignment.bank-select.xg-kits
  source: code
  platforms: [desktop, android]
  claim: "In XG mode, drum kits are chosen from XG's own kit list, so kits numbered like GS kits but different (such as the Symphony Kit) are drawn correctly"
- id: midi.assignment.bank-select.unlike-sound-shows-nothing
  source: code
  platforms: [desktop, android]
  claim: "A sound effect variation that is a different sound from its program's instrument (such as a door under Telephone) puts nothing on stage rather than the wrong instrument"
- id: midi.assignment.bank-select.fallback
  source: code
  platforms: [desktop, android]
  claim: "A GS, XG or GM2 voice without an instrument of its own is shown as the General MIDI instrument with the same program"
- id: midi.assignment.same-look-merges
  source: code
  platforms: [desktop, android]
  claim: "A channel switching between programs drawn as the same instrument keeps one instrument on stage"
- id: midi.assignment.rhythm-channel.gs
  source: code
  platforms: [desktop, android]
  claim: "A channel set as a rhythm part by the GS 'use for rhythm part' message plays drums, not the melodic instrument of its program"
- id: midi.assignment.rhythm-channel.xg
  source: code
  platforms: [desktop, android]
  claim: "In XG mode, a channel selecting drum bank 127 or 126, or set to a drum part mode, plays drums"
- id: midi.assignment.rhythm-channel.gm2
  source: code
  platforms: [desktop, android]
  claim: "In GM2 mode, bank 120 makes a channel a rhythm channel and bank 121 a melodic one"
- id: midi.assignment.rhythm-channel.shared-kit
  source: code
  platforms: [desktop, android]
  claim: "Drums on a second rhythm channel play on channel 10's drum set when both kits share the General MIDI drum layout; orchestra and SFX kits get their own"

